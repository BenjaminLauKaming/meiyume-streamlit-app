# Docker Compose file for development environment

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: meiyume_ai_assistant_db_dev
    environment:
      POSTGRES_DB: meiyume_ai_assistant_dev
      POSTGRES_USER: cad_user
      POSTGRES_PASSWORD: cad_password_dev
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cad_analyzer_network

  # Redis for Celery
  redis:
    image: redis:7-alpine
    container_name: meiyume_ai_assistant_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - cad_analyzer_network

  # Django Backend
  django:
    build:
      context: .
      dockerfile: docker/django/Dockerfile.dev
    container_name: meiyume_ai_assistant_django_dev
    environment:
      - DJANGO_SETTINGS_MODULE=meiyume_ai_assistant.settings.development
      - DATABASE_URL=postgresql://cad_user:cad_password_dev@db:5432/meiyume_ai_assistant_dev
      - REDIS_URL=redis://redis:6379/0
      - N8N_WEBHOOK_URL=https://meiyume.app.n8n.cloud/webhook/fe198a5f-79e0-4dc7-82d1-ce7fb65e9c5e
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - media_files_dev:/app/media
      - static_files_dev:/app/staticfiles
    depends_on:
      - db
      - redis
    networks:
      - cad_analyzer_network
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  # Streamlit Frontend
  streamlit:
    build:
      context: .
      dockerfile: docker/streamlit/Dockerfile.dev
    container_name: meiyume_ai_assistant_streamlit_dev
    environment:
      - DJANGO_API_URL=http://django:8000
    ports:
      - "8501:8501"
    volumes:
      - ./streamlit_app:/app
      - ./streamlit_app/.streamlit:/app/.streamlit
    depends_on:
      - django
    networks:
      - cad_analyzer_network
    command: streamlit run main.py --server.address 0.0.0.0 --server.fileWatcherType poll --server.runOnSave true

  # n8n Workflow Engine
  n8n:
    image: n8nio/n8n:1.19.4
    container_name: meiyume_ai_assistant_n8n_dev
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      - WEBHOOK_URL=http://localhost:5678
      - GENERIC_TIMEZONE=UTC
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_BINARY_DATA_TTL=24
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
    ports:
      - "5678:5678"
    volumes:
      - n8n_data_dev:/home/node/.n8n
    networks:
      - cad_analyzer_network

  # Celery Worker (for background tasks)
  celery:
    build:
      context: .
      dockerfile: docker/django/Dockerfile.dev
    container_name: meiyume_ai_assistant_celery_dev
    environment:
      - DJANGO_SETTINGS_MODULE=meiyume_ai_assistant.settings.development
      - DATABASE_URL=postgresql://cad_user:cad_password_dev@db:5432/meiyume_ai_assistant_dev
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - media_files_dev:/app/media
    depends_on:
      - db
      - redis
    networks:
      - cad_analyzer_network
    command: celery -A meiyume_ai_assistant worker -l info

volumes:
  postgres_data_dev:
  redis_data_dev:
  media_files_dev:
  static_files_dev:
  n8n_data_dev:

networks:
  meiyume_ai_assistant_network:
    driver: bridge 