# Docker Compose file for production environment

services:
  # PostgreSQL Database - Production
  db:
    image: postgres:15-alpine
    container_name: cad_analyzer_db_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cad_analyzer_network
    restart: unless-stopped
    # Don't expose port in production - only internal access

  # Redis for Celery - Production
  redis:
    image: redis:7-alpine
    container_name: cad_analyzer_redis_prod
    volumes:
      - redis_data_prod:/data
    networks:
      - cad_analyzer_network
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}

  # Django Backend - Production
  django:
    build:
      context: .
      dockerfile: docker/django/Dockerfile.prod
    container_name: cad_analyzer_django_prod
    environment:
      - DJANGO_SETTINGS_MODULE=ai_cad_analyzer.settings.production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY}
      - N8N_FORM_URL=${N8N_FORM_URL}
      - AZURE_AD_CLIENT_ID=${AZURE_AD_CLIENT_ID}
      - AZURE_AD_CLIENT_SECRET=${AZURE_AD_CLIENT_SECRET}
      - AZURE_AD_TENANT_ID=${AZURE_AD_TENANT_ID}
    volumes:
      - media_files_prod:/app/media
      - static_files_prod:/app/staticfiles
    depends_on:
      - db
      - redis
    networks:
      - cad_analyzer_network
    restart: unless-stopped
    # Internal port only - will be accessed through nginx

  # Streamlit Frontend - Production
  streamlit:
    build:
      context: .
      dockerfile: docker/streamlit/Dockerfile.prod
    container_name: cad_analyzer_streamlit_prod
    environment:
      - DJANGO_API_URL=http://django:8000
    depends_on:
      - django
    networks:
      - cad_analyzer_network
    restart: unless-stopped
    # Internal port only - will be accessed through nginx

  # n8n Workflow Engine - Production
  n8n:
    image: n8nio/n8n:1.19.4
    container_name: cad_analyzer_n8n_prod
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_ADMIN_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_ADMIN_PASSWORD}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - GENERIC_TIMEZONE=UTC
      - N8N_SECURE_COOKIE=true
      - N8N_PROTOCOL=https
      - N8N_HOST=${N8N_HOST}
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_BINARY_DATA_TTL=24
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
    volumes:
      - n8n_data_prod:/home/node/.n8n
    networks:
      - cad_analyzer_network
    restart: unless-stopped

  # Celery Worker - Production
  celery:
    build:
      context: .
      dockerfile: docker/django/Dockerfile.prod
    container_name: cad_analyzer_celery_prod
    environment:
      - DJANGO_SETTINGS_MODULE=ai_cad_analyzer.settings.production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY}
    volumes:
      - media_files_prod:/app/media
    depends_on:
      - db
      - redis
    networks:
      - cad_analyzer_network
    restart: unless-stopped
    command: celery -A ai_cad_analyzer worker -l info

  # Celery Beat (Scheduler) - Production
  celery-beat:
    build:
      context: .
      dockerfile: docker/django/Dockerfile.prod
    container_name: cad_analyzer_celery_beat_prod
    environment:
      - DJANGO_SETTINGS_MODULE=ai_cad_analyzer.settings.production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - db
      - redis
    networks:
      - cad_analyzer_network
    restart: unless-stopped
    command: celery -A ai_cad_analyzer beat -l info

  # Nginx Reverse Proxy - Production
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: cad_analyzer_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_files_prod:/app/staticfiles
      - media_files_prod:/app/media
      - ./docker/nginx/certs:/etc/nginx/certs
    depends_on:
      - django
      - streamlit
      - n8n
    networks:
      - cad_analyzer_network
    restart: unless-stopped

volumes:
  postgres_data_prod:
  redis_data_prod:
  media_files_prod:
  static_files_prod:
  n8n_data_prod:

networks:
  cad_analyzer_network:
    driver: bridge 