name: 🚀 CI/CD Pipeline - CAD Analyzer

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice 
        options:
        - staging
        - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 🧪 Testing and Code Quality
  test:
    name: 🧪 Test & Code Quality
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_cad_analyzer
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov flake8 black isort bandit safety

      - name: 🔍 Run linting
        run: |
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
          black --check backend/
          isort --check-only backend/

      - name: 🔒 Security checks
        run: |
          bandit -r backend/ -f json -o bandit-report.json || true
          safety check --json --output safety-report.json || true

      - name: 🧪 Run Django tests
        env:
          DATABASE_URL: postgres://postgres:test_password@localhost:5432/test_cad_analyzer
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SETTINGS_MODULE: ai_cad_analyzer.settings.development
          SECRET_KEY: test-secret-key-for-ci
        run: |
          cd backend
          python manage.py migrate
          python manage.py test --verbosity=2
          
      - name: 📊 Upload coverage reports
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: 📈 Upload test artifacts
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-reports
          path: |
            bandit-report.json
            safety-report.json
            coverage.xml

  # 🔨 Build Docker Images
  build:
    name: 🔨 Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    outputs:
      django-image: ${{ steps.meta-django.outputs.tags }}
      streamlit-image: ${{ steps.meta-streamlit.outputs.tags }}
      nginx-image: ${{ steps.meta-nginx.outputs.tags }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Django Backend
      - name: 📝 Extract metadata (Django)
        id: meta-django
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/django
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🔨 Build and push Django image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/django/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-django.outputs.tags }}
          labels: ${{ steps.meta-django.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Streamlit Frontend
      - name: 📝 Extract metadata (Streamlit)
        id: meta-streamlit
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/streamlit
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🔨 Build and push Streamlit image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/streamlit/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-streamlit.outputs.tags }}
          labels: ${{ steps.meta-streamlit.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Nginx Proxy
      - name: 📝 Extract metadata (Nginx)
        id: meta-nginx
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/nginx
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🔨 Build and push Nginx image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/nginx
          push: true
          tags: ${{ steps.meta-nginx.outputs.tags }}
          labels: ${{ steps.meta-nginx.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 🔍 Security Scanning
  security:
    name: 🔍 Security Scanning
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.django-image }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: 📊 Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # 🚀 Deploy to Staging
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to staging server
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "Django image: ${{ needs.build.outputs.django-image }}"
          echo "Streamlit image: ${{ needs.build.outputs.streamlit-image }}"
          echo "Nginx image: ${{ needs.build.outputs.nginx-image }}"
          # Add your staging deployment logic here
          # This could be updating a staging server, deploying to cloud platforms, etc.

  # 🏭 Deploy to Production
  deploy-production:
    name: 🏭 Deploy to Production  
    runs-on: ubuntu-latest
    needs: [test, build, security]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏭 Deploy to production server
        run: |
          echo "🏭 Deploying to production environment..."
          echo "Django image: ${{ needs.build.outputs.django-image }}"
          echo "Streamlit image: ${{ needs.build.outputs.streamlit-image }}"
          echo "Nginx image: ${{ needs.build.outputs.nginx-image }}"
          # Add your production deployment logic here

      - name: 📣 Notify deployment success
        if: success()
        run: |
          echo "✅ Production deployment successful!"
          # You can add Slack/Discord/Email notifications here

  # 📊 Post-deployment Health Check
  health-check:
    name: 📊 Health Check
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always() && (needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')

    steps:
      - name: 🏥 Run health checks
        run: |
          echo "🏥 Running post-deployment health checks..."
          # Add health check logic here (curl endpoints, run smoke tests, etc.)
          echo "✅ All health checks passed!" 