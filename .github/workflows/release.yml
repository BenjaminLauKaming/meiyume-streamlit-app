name: 🏷️ Release Management

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 🏷️ Create Release
  create-release:
    name: 🏷️ Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: 📝 Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: ".github/changelog-config.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: Release ${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'rc') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'alpha') }}

  # 🔨 Build Release Images
  build-release:
    name: 🔨 Build Release Images
    runs-on: ubuntu-latest
    needs: create-release

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push Django release image
      - name: 🔨 Build and push Django release image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/django/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/django:${{ needs.create-release.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/django:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and push Streamlit release image
      - name: 🔨 Build and push Streamlit release image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/streamlit/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/streamlit:${{ needs.create-release.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/streamlit:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and push Nginx release image
      - name: 🔨 Build and push Nginx release image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/nginx
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/nginx:${{ needs.create-release.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/nginx:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 📦 Package Release Artifacts
  package-artifacts:
    name: 📦 Package Release Artifacts
    runs-on: ubuntu-latest
    needs: [create-release, build-release]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Create deployment package
        run: |
          mkdir -p release-artifacts
          
          # Copy deployment files
          cp docker-compose.prod.yml release-artifacts/
          cp -r scripts/ release-artifacts/
          cp env_template.txt release-artifacts/
          cp README.md release-artifacts/
          cp SETUP.md release-artifacts/
          
          # Create deployment instructions
          cat > release-artifacts/DEPLOYMENT.md << 'EOF'
          # CAD Analyzer Deployment Guide
          
          ## Version: ${{ needs.create-release.outputs.version }}
          
          ### Quick Start
          
          1. Copy `env_template.txt` to `.env.prod` and configure your environment variables
          2. Run: `chmod +x scripts/setup-production.sh && ./scripts/setup-production.sh`
          3. Start: `./scripts/prod-start.sh`
          
          ### Docker Images Used
          
          - Django: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/django:${{ needs.create-release.outputs.version }}`
          - Streamlit: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/streamlit:${{ needs.create-release.outputs.version }}`
          - Nginx: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/nginx:${{ needs.create-release.outputs.version }}`
          
          ### Prerequisites
          
          - Docker & Docker Compose
          - PostgreSQL (if not using Docker)
          - SSL certificates (for production)
          
          For detailed instructions, see SETUP.md
          EOF
          
          # Create archive
          tar -czf cad-analyzer-${{ needs.create-release.outputs.version }}.tar.gz -C release-artifacts .

      - name: 📤 Upload release artifacts
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./cad-analyzer-${{ needs.create-release.outputs.version }}.tar.gz
          asset_name: cad-analyzer-${{ needs.create-release.outputs.version }}.tar.gz
          asset_content_type: application/gzip 