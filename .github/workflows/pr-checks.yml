name: 🔍 PR Checks

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'streamlit_app/**'
      - 'requirements.txt'
      - 'docker/**'
      - '.github/workflows/**'

jobs:
  # 🚀 Quick validation for PRs
  pr-validation:
    name: 🚀 PR Quick Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort bandit

      - name: 🔍 Run quick linting
        run: |
          echo "🔍 Running linting checks..."
          flake8 backend/ --count --max-line-length=120 --statistics
          black --check backend/ --diff
          isort --check-only backend/ --diff

      - name: 🔒 Quick security scan
        run: |
          echo "🔒 Running security checks..."
          bandit -r backend/ -ll

      - name: 📋 Check Docker files
        run: |
          echo "📋 Validating Docker configurations..."
          docker compose -f docker-compose.yml config > /dev/null
          docker compose -f docker-compose.prod.yml config > /dev/null
          echo "✅ Docker configurations are valid"

      - name: 📝 Validate requirements.txt
        run: |
          echo "📝 Checking requirements.txt..."
          pip install -r requirements.txt --dry-run
          echo "✅ Requirements validation passed"

  # 🧪 Run tests on changed files only
  changed-files-test:
    name: 🧪 Test Changed Files
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v40
        with:
          files: |
            backend/**
            streamlit_app/**

      - name: 📊 List changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Changed files:"
          echo "${{ steps.changed-files.outputs.all_changed_files }}"

      - name: 🐍 Set up Python
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django

      - name: 🧪 Run targeted tests
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          DJANGO_SETTINGS_MODULE: ai_cad_analyzer.settings.development
          SECRET_KEY: test-secret-key-for-pr
        run: |
          cd backend
          python manage.py test --verbosity=1 --keepdb 